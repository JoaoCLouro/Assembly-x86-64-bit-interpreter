repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Trims trailing whitespace from the end of lines.
        entry: trailing-whitespace-fixer
        language: python
        types: [text]
        pass_filenames: true

      - id: end-of-file-fixer
        name: Ensure files end with a new line
        description: Ensures that a file is either empty, or ends with one blank line.
        entry: end-of-file-fixer
        language: python
        types: [text]
        pass_filenames: true

      - id: check-yaml
        name: Validate YAML files
        description: Checks YAML files for parseable syntax.
        entry: check-yaml
        language: python
        types: [yaml]
        pass_filenames: true

      - id: detect-private-key
        name: Check if any private keys are left unignored
        description: Detects the presence of private keys to prevent them from being committed.
        entry: detect-private-key
        language: python
        types: [text]
        pass_filenames: true

      - id: check-merge-conflict
        name: Check for merge conflict markers
        description: Checks for merge conflict markers in files to prevent committing unresolved conflicts.
        entry: check-merge-conflict

      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        name: Check linting and format
        description: Checks default python ruff linting rules and formats files for consistency
        entry: uv run ruff check --fix

      - id: ruff-format
        name: Format code with ruff
        description: Formats code using ruff to ensure consistent style.
        entry: uv run ruff format



  - repo: local
    hooks:
      - id: pytest-testmon
        name: Run pytest with testmon
        description: Runs pytest with testmon to only run tests affected by code changes.
        entry: uv run pytest --testmon
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
