[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-simulator"
version = "0.3.2"
description = "x86-64 assembly interpreter (Python + C)"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.8",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-testmon"
]

[tool.setuptools.packages.find]
include = ["interpreter*"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-testmon>=2.2.0",
    "ruff>=0.17.4",
]
