name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

# Cancel in-progress runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================
  # Job 1: Verify Pre-commit Hooks
  # ==============================
  verify:
    name: Verify pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run Pre-commit Hooks
        uses: pre-commit/action@v3.0.1

  # ========================
  # Job 2: Quality and Types
  # ========================
  quality:
    name: Quality and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "uv-quality"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run Ruff Linting Check
        run: uv run ruff check --fix .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

  # =================
  # Job 3: Test Suite
  # =================
  test:
    name: Test Suite (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "uv-test-${{ matrix.os }}-${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Project Dependencies
        run: uv sync --frozen --dev

      - name: Run Pytest (with Coverage on Ubuntu 3.10)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.10" ]; then
            uv run pytest --cov=. --cov-report=xml
          else
            uv run pytest
          fi
        shell: bash

      - name: Smoke-test CLI Entry Point
        run: uv run cpu-sim --help

      - name: Upload Coverage Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
