[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Assembly-Interpreter"
version = "0.4.0"
description = "x86-64 assembly interpreter (Python + C)"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.8",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-testmon"
]

[project.scripts]
interpreter = "interpreter.runner:main"

[tool.setuptools.packages.find]
include = ["interpreter*"]

[tool.setuptools.package-data]
"interpreter" = [
    "_src/execution/include/*.h",
    "_src/execution/src/*.c",
    "_src/lib/*.so",
    "_src/lib/*.dylib",
    "_src/lib/*.dll",
    "_src/lib/*.pyd",
]

[[tool.setuptools.ext-modules]]
name = "interpreter._src.lib.libmmu"
sources = ["interpreter/_src/execution/src/memory_eng.c"]
include-dirs = ["interpreter/_src/execution/include"]

[[tool.setuptools.ext-modules]]
name = "interpreter._src.lib.liboperations"
sources = ["interpreter/_src/execution/src/operations.c"]
include-dirs = ["interpreter/_src/execution/include"]

[[tool.setuptools.ext-modules]]
name = "interpreter._src.lib.libreg"
sources = ["interpreter/_src/execution/src/registers.c"]
include-dirs = ["interpreter/_src/execution/include"]

[[tool.setuptools.ext-modules]]
name = "interpreter._src.lib.libscl"
sources = ["interpreter/_src/execution/src/syscall.c"]
include-dirs = ["interpreter/_src/execution/include"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-testmon>=2.2.0",
    "ruff>=0.17.4",
]
